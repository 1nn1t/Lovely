<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Lovely!</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/liquid-gl@3.0.0/liquidGL.js" crossorigin>
<style>
:root{--accent:#e0457b;--bg:#17131f;--ink:#f1eefb;--card:color-mix(in srgb,#17131f 85%,white);--glass-tint:rgba(0,0,0,.09);--glass-shade:.09;--lens-bg:rgba(0,0,0,.09);--font:ui-rounded,system-ui,sans-serif;--ease:cubic-bezier(.2,.75,.25,1);--spring:cubic-bezier(.3,1.5,.5,1)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 var(--font);padding:env(safe-area-inset-top) 16px env(safe-area-inset-bottom);transition:padding-left .2s}
main{max-width:480px;margin:0 auto;padding:16px 0 120px}
#bg{position:fixed;inset:0;z-index:-1}
#bg img,#bg video{width:100%;height:100%;object-fit:cover}
.card{background:var(--card);border-radius:20px;padding:16px;margin-bottom:14px}
body.media .card{background:color-mix(in srgb,var(--card) 75%,transparent);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px)}
.hero{text-align:center;padding:28px 16px}.hero h2{margin:6px 0 2px;font-size:26px}
.hero-name-row{display:flex;align-items:center;justify-content:center;gap:10px}
.hero-avatar{width:36px;height:36px;border-radius:50%;object-fit:cover;border:2px solid var(--accent)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:#aaa;margin-right:6px}.dot.on{background:#2fbf71}
.muted{opacity:.6;font-size:14px}
h3{margin:20px 0 4px;font-size:17px}label{display:block;margin-top:6px}
.chk{display:flex;gap:8px;align-items:center}.chk input{width:auto;margin:0}
button,input,textarea,select{font:inherit;color:inherit}
input,textarea,select{width:100%;padding:8px 10px;border-radius:12px;border:1px solid color-mix(in srgb,var(--ink) 14%,transparent);background:color-mix(in srgb,var(--ink) 6%,transparent);margin:2px 0}
input[type=range]{padding:0;border:0;background:none;accent-color:var(--accent)}
button{position:relative;border:0;border-radius:999px;padding:8px 14px;background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 86%,white),var(--accent));color:#fff;cursor:pointer;box-shadow:inset 0 1px 0 #ffffff59,0 4px 14px color-mix(in srgb,var(--accent) 32%,transparent);transition:transform .45s var(--spring),filter .2s}
button:not(.ni,.tgl):active{transform:scale(.93);filter:brightness(1.08)}
button.ghost{color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.row{display:flex;gap:8px}.row>input{flex:1}
.ico{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 10px);transform:translateX(-50%);background:var(--accent);color:#fff;max-width:90vw;box-shadow:0 4px 16px #0004;padding:10px 16px;border-radius:20px;display:none;z-index:30}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:12px}
.grid img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:12px;display:block;cursor:pointer}
#lb{position:fixed;inset:0;z-index:20;background:#0008;-webkit-backdrop-filter:blur(calc(var(--glass-blur,20px) * 1.3)) saturate(160%);backdrop-filter:blur(calc(var(--glass-blur,20px) * 1.3)) saturate(160%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:16px}
#lb img{max-width:100%;max-height:80vh;border-radius:12px}

/* messages */
.messages{max-width:560px;height:calc(100dvh - 150px);min-height:340px;margin:0 auto;display:flex;flex-direction:column;padding:4px 0 80px;overflow:hidden}
.messages-head{position:sticky;top:env(safe-area-inset-top);z-index:2;display:flex;flex-direction:column;align-items:center;padding:8px 0 16px}
.messages-avatar{width:64px;height:64px;border-radius:50%;object-fit:cover;background:color-mix(in srgb,var(--accent) 16%,var(--card));border:2px solid color-mix(in srgb,var(--accent) 55%,white);box-shadow:0 6px 18px #0002}
.messages-avatar-fallback{display:grid;place-items:center;font-size:28px}
.messages-title,.message-composer{border:1px solid #ffffff70;border-radius:999px;-webkit-backdrop-filter:blur(var(--b,16px)) saturate(160%);backdrop-filter:blur(var(--b,16px)) saturate(160%)}
.messages-title{position:relative;margin-top:-10px;padding:6px 16px;background:color-mix(in srgb,var(--card) 62%,transparent);box-shadow:0 5px 18px #00000014,inset 0 1px 0 #ffffff80;text-align:center;font-size:14px;font-weight:650;line-height:1.2}
.messages-title.online{color:#fff;background:linear-gradient(rgba(0,0,0,var(--glass-shade,.09)),rgba(0,0,0,var(--glass-shade,.09))),color-mix(in srgb,#34c759 58%,transparent);border-color:#ffffff60;box-shadow:0 5px 18px #34c75935,inset 0 1px 0 #ffffff70}
.messages-list{display:flex;flex-direction:column;gap:7px;flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:8px 2px 14px}
.message{max-width:min(82%,380px);padding:9px 13px;border-radius:19px;background:color-mix(in srgb,var(--card) 78%,transparent);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);box-shadow:0 2px 8px #0000000c;overflow-wrap:anywhere}
.message.me{align-self:flex-end;color:#fff;background:linear-gradient(145deg,color-mix(in srgb,var(--accent) 82%,white),var(--accent));border-bottom-right-radius:7px}
.message:not(.me){align-self:flex-start;border-bottom-left-radius:7px}
.message-time{margin-top:4px;font-size:10px;opacity:.6;text-align:right}
.message.me .message-time{color:#fff;opacity:.8}
.messages-empty{margin:auto 0;text-align:center;padding:24px 18px;opacity:.58}
.message-composer{--b:18px;position:fixed;z-index:4;left:50%;bottom:calc(env(safe-area-inset-bottom) + var(--message-composer-bottom,82px));translate:-50% 0;width:min(560px,calc(100% - 28px));display:flex;align-items:center;gap:8px;padding:7px 8px 7px 14px;background:color-mix(in srgb,var(--card) 68%,transparent);box-shadow:0 8px 24px #00000018,inset 0 1px 0 #ffffff80}
.message-composer input{min-width:0;margin:0;padding:7px 0;border:0;background:transparent;outline:none}
.message-composer button{width:36px;height:36px;flex:none;display:grid;place-items:center;padding:0;box-shadow:0 2px 7px color-mix(in srgb,var(--accent) 35%,transparent)}
.message-composer .ico{width:19px;height:19px;stroke-width:2.2}

/* ===== liquid glass system: CSS tier everywhere, plus a WebGL lens on .gl pills ===== */
:root{--rim:linear-gradient(135deg,#fffffff0,#ffffff14 30%,#ffffff0a 62%,#ffffffd0);--glass-bg:linear-gradient(rgba(0,0,0,var(--glass-shade,.015)),rgba(0,0,0,var(--glass-shade,.015))),color-mix(in srgb,var(--card) var(--glass-a,58%),transparent)}
#bg{background:radial-gradient(55% 38% at 12% 6%,color-mix(in srgb,var(--accent) 42%,transparent),transparent 72%),radial-gradient(60% 42% at 92% 78%,color-mix(in srgb,#6f7dff 32%,transparent),transparent 72%),radial-gradient(50% 36% at 30% 100%,color-mix(in srgb,#ffb36b 22%,transparent),transparent 72%)}
body.media #bg{background:none}
.card,button.ghost,.messages-title,.message-composer,.message:not(.me){background:var(--glass-bg);-webkit-backdrop-filter:blur(var(--glass-blur,20px)) saturate(var(--glass-sat,190%)) brightness(1.05);backdrop-filter:blur(var(--glass-blur,20px)) saturate(var(--glass-sat,190%)) brightness(1.05);border:1px solid #ffffff38;box-shadow:0 10px 30px #00000024,0 1px 4px #0000000f,inset 0 1px 0 #ffffffb3,inset 0 -1px 0 #ffffff2e,inset 0 0 20px #ffffff14}
.card,.message{position:relative}
.card::before,button.ghost::before,.messages-title::before,.message-composer::before,.message:not(.me)::before,#toast::before,button:not(.ni,.tgl,.ghost)::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;pointer-events:none;background:var(--rim);opacity:.8;
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);mask-composite:exclude}
.message.me{box-shadow:inset 0 1px 0 #ffffff66,0 4px 14px color-mix(in srgb,var(--accent) 30%,transparent)}
.ni,.tgl{box-shadow:none}
/* interactive glass: a light follows the finger */
button:not(.ni,.tgl)::after,.message-composer::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:0;transition:opacity .35s;background:radial-gradient(90px circle at var(--gx,50%) var(--gy,50%),#ffffff59,transparent 70%)}
button:not(.ni,.tgl).pressed::after,.message-composer.pressed::after{opacity:1}
#toast{background:color-mix(in srgb,var(--accent) 72%,transparent);-webkit-backdrop-filter:blur(var(--glass-blur,20px)) saturate(var(--glass-sat,190%));backdrop-filter:blur(var(--glass-blur,20px)) saturate(var(--glass-sat,190%));border:1px solid #ffffff4d;box-shadow:0 10px 30px #0003,inset 0 1px 0 #ffffff80;animation:toastIn .6s var(--spring)}
@keyframes toastIn{from{opacity:0;transform:translateX(-50%) translateY(-24px) scale(.9)}}
/* elements with a WebGL lens (see initViewGlass) */
.gl{opacity:1!important}
.gl>*:not(.contact-body){position:relative;z-index:2}
.gl>.contact-body{z-index:2}
.gl.liquid-glass-ready{pointer-events:auto!important;transition:none!important;background:transparent!important;-webkit-backdrop-filter:none!important;backdrop-filter:none!important}
.messages-title.online.liquid-glass-ready{background:linear-gradient(rgba(0,0,0,var(--glass-shade,.015)),rgba(0,0,0,var(--glass-shade,.015))),color-mix(in srgb,#34c759 58%,transparent)!important}
/* tint slider: a glass track with 5 notches, no numbers */
.tint{position:relative;height:34px;margin-top:8px}
.tint input{position:absolute;inset:0;width:100%;height:34px;margin:0;padding:0;border:0;background:transparent;-webkit-appearance:none;appearance:none;z-index:2}
.tint input::-webkit-slider-runnable-track{height:34px;border-radius:999px;background:var(--glass-bg);border:1px solid #ffffff38;box-shadow:inset 0 1px 0 #ffffff80,inset 0 0 12px #ffffff1a}
.tint input::-moz-range-track{height:32px;border-radius:999px;background:var(--glass-bg);border:1px solid #ffffff38;box-shadow:inset 0 1px 0 #ffffff80}
.tint input::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;margin-top:2px;border-radius:50%;border:0;background:linear-gradient(180deg,#fff,#e9e6f5);box-shadow:0 3px 10px #0004,inset 0 -2px 4px #0001;transition:transform .35s var(--spring)}
.tint input::-moz-range-thumb{width:28px;height:28px;border-radius:50%;border:0;background:linear-gradient(180deg,#fff,#e9e6f5);box-shadow:0 3px 10px #0004}
.tint input:active::-webkit-slider-thumb{transform:scale(1.18)}
.tint-ticks{position:absolute;inset:0;display:flex;justify-content:space-between;align-items:center;padding:0 12px;pointer-events:none;z-index:1}
.tint-ticks i{width:4px;height:4px;border-radius:50%;background:color-mix(in srgb,var(--ink) 35%,transparent)}
.tint-ends{display:flex;justify-content:space-between;margin-top:6px;font-size:12px}
/* messages: the name pill springs open into a glass panel (JS-driven, same spring as the menu bar) */
.contact-wrap{position:relative;z-index:3;width:100%;height:31px;margin-top:-10px}
.contact-wrap .messages-title{position:absolute!important;top:0;left:50%;translate:-50% 0;margin:0;padding:0;overflow:hidden;border-radius:16px;will-change:width,height}
.messages-title.online.open{color:var(--ink);background:var(--glass-bg);border-color:#ffffff38;box-shadow:0 10px 30px #00000024,inset 0 1px 0 #ffffffb3,inset 0 0 20px #ffffff14}
.messages-title.online.open.liquid-glass-ready{background:linear-gradient(rgba(0,0,0,var(--glass-shade,.015)),rgba(0,0,0,var(--glass-shade,.015))),color-mix(in srgb,#34c759 58%,transparent)!important}
.contact-head{display:flex;align-items:center;justify-content:center;gap:6px;width:max-content;margin:0 auto;padding:6px 16px;white-space:nowrap;cursor:pointer;-webkit-tap-highlight-color:transparent;outline:none}
.chev{width:14px;height:14px;stroke-width:2.4}
.contact-wrap .contact-body{position:absolute;left:50%;top:var(--ch,31px);translate:-50% 0;width:var(--cw,300px);box-sizing:border-box;padding:0 4px 14px;opacity:0;pointer-events:none;text-align:left;font-weight:500}
.contact-inner{display:flex;flex-direction:column;gap:8px}
.contact-inner .row{margin-top:10px;flex-wrap:wrap}.contact-inner .row button{flex:1}
.contact-inner label{font-size:12px;margin:0}
.contact-inner input{padding:7px 10px;font-size:14px;margin-top:3px}
/* open panel: thick frosted material so text stays legible over any photo */
.contact-wrap .messages-title.open{background:color-mix(in srgb,var(--card) calc(var(--glass-a,58%) + 16%),transparent);-webkit-backdrop-filter:blur(calc(var(--glass-blur,20px) * 1.6)) saturate(var(--glass-sat,190%));backdrop-filter:blur(calc(var(--glass-blur,20px) * 1.6)) saturate(var(--glass-sat,190%));
  box-shadow:0 18px 50px #00000040,0 2px 8px #0000001a,inset 0 1px 0 #ffffffb3,inset 0 -1px 0 #ffffff2e}
.contact-wrap .contact-body{padding:6px 14px 14px}
.contact-inner{gap:6px}
.contact-inner .row{margin-top:2px;gap:8px;flex-wrap:nowrap}
.contact-inner button{height:42px;padding:0 14px;font-weight:600;font-size:15px}
.contact-inner button.ghost{background:color-mix(in srgb,var(--ink) 12%,transparent);border:0;box-shadow:none;-webkit-backdrop-filter:none;backdrop-filter:none}
.contact-inner button.ghost::before{display:none}
.contact-inner #cbgx{color:#ff6b61}
.contact-inner .sec{font-size:12px;font-weight:500;opacity:.6;margin:10px 4px 0}
.contact-inner input{height:42px;padding:0 14px;font-size:16px;margin:0;border:0;border-radius:14px;background:color-mix(in srgb,var(--ink) 11%,transparent);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--ink) 9%,transparent)}
.contact-inner input::placeholder{color:color-mix(in srgb,var(--ink) 42%,transparent)}
.contact-inner .foot{font-size:12px;font-weight:400;opacity:.55;margin:0 4px 6px}
.contact-inner #cn-save{margin-top:4px;height:46px}
@media(prefers-reduced-motion:reduce){button{transition:none!important}#toast{animation:none}}
@media(prefers-reduced-transparency:reduce){.card,button.ghost,.messages-title:not(.online),.message-composer,.message:not(.me),#lb{-webkit-backdrop-filter:none!important;backdrop-filter:none!important;background:var(--card)!important}#bg{background:none}}

/* navigation */
#nav{position:fixed;z-index:5;display:flex;flex-direction:column;align-items:center;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
.ni{background:none;color:var(--ink);display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;padding:8px 16px;border-radius:999px;opacity:.65}
.ni.on{opacity:1;color:var(--accent)}
.ni .ico{width:24px;height:24px}
.tgl,.glass-indicator{display:none}
body.nonav #nav{display:none}

@media(max-width:767px){
  /* Find My metrics (measured from the recording, in pt): bar 336x78, radius ~39, tabs 70 wide, selection pill 84x49, expanded sheet 364 wide, radius 38, inner bar inset 14 */
  #nav{left:50%;bottom:calc(env(safe-area-inset-bottom) + 8px);translate:-50% 0;transform-origin:50% 100%;
    scale:calc(var(--nav-scale,1) * var(--nav-motion-x,1)) calc(var(--nav-scale,1) * var(--nav-motion-y,1));
    justify-content:flex-end;width:min(336px,calc((100vw - 16px) / var(--nav-scale,1)));padding:0;border:1px solid #ffffff40;border-radius:39px;overflow:hidden;
    background:var(--glass-tint);-webkit-backdrop-filter:blur(calc(var(--glass-blur,20px) * .7 + var(--p,0) * 6px)) saturate(200%) brightness(1.04);backdrop-filter:blur(calc(var(--glass-blur,20px) * .7 + var(--p,0) * 6px)) saturate(200%) brightness(1.04);
    box-shadow:0 12px 32px #0000002e,0 2px 8px #00000014,inset 0 1px 0 #ffffffb3,inset 0 -1px 0 #ffffff33,inset 0 0 22px #ffffff26;
    will-change:scale,height,width}
  /* the tab row is the bar at rest; when the sheet opens it becomes the inner bar, inset 14 on three sides.
     Its height shrinks 76 -> 64 as the sheet opens, and it counter-scales against the sheet's pull stretch (--sheet-x/y, weighted by --lock) so it never stretches. */
  #nav-row{position:relative;z-index:2;display:flex;align-items:center;justify-content:space-between;align-self:stretch;
    height:calc(76px - var(--p,0) * 12px);transform-origin:50% 100%;
    scale:calc(1 / (1 + (var(--sheet-x,1) - 1) * var(--lock,0))) calc(1 / (1 + (var(--sheet-y,1) - 1) * var(--lock,0)));
    padding:0 27px;margin:0 calc(var(--p,0) * 14px) calc(var(--p,0) * 14px);border-radius:36px;
    background:rgba(255,255,255,calc(var(--p,0) * .06));border:1px solid rgba(255,255,255,calc(var(--p,0) * .14));box-shadow:inset 0 1px 0 rgba(255,255,255,calc(var(--p,0) * .12))}
  #nav .ni{flex:1;min-width:0;height:49px;justify-content:center;gap:2px;padding:0;border-radius:999px;font-size:11px;font-weight:700;letter-spacing:.01em;white-space:nowrap;position:relative;z-index:2;opacity:1;transition:color .2s,opacity .2s}
  #nav .ni .ico{width:27px;height:27px;stroke-width:2;transition:transform .35s var(--spring)}
  #nav .ni.on .ico,#nav .ni.hot .ico{transform:scale(1.1)}
  #nav .ni.hot{color:var(--accent);opacity:1}
  #nav .ni.on{color:var(--accent);opacity:1}
  #nav.is-dragging .ni.on:not(.hot){color:var(--ink);opacity:1}
  /* grabber: visible 52x4.5 pill, 6 from the top, with a bigger invisible tap area */
  #nav-handle{position:absolute;z-index:4;top:0;left:50%;translate:-50% 0;width:96px;height:18px;cursor:pointer}
  #nav-handle::before{content:"";position:absolute;left:50%;top:6px;translate:-50% 0;width:52px;height:4.5px;border-radius:3px;background:color-mix(in srgb,var(--ink) 38%,transparent)}
  /* specular rim + light pooling that follows the lens; the sheet gets a frosted top-left glow as it opens */
  #nav::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;pointer-events:none;z-index:3;
    background:linear-gradient(135deg,#fffffff2,#ffffff14 28%,#ffffff0a 62%,#ffffffd9);
    -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;
    mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);mask-composite:exclude}
  #nav::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:0;
    background:radial-gradient(70px 48px at var(--lx,50%) 50%,rgba(255,255,255,calc(.25 * (1 - var(--p,0)))),transparent 70%),
      radial-gradient(120% 70% at 18% 0%,rgba(255,255,255,calc(var(--p,0) * .16)),transparent 70%),rgba(255,255,255,calc(var(--p,0) * .05))}
  /* selection pill: darker, sits inside the row, stays visible when the sheet is open */
  #nav .glass-indicator{display:block;position:absolute;z-index:1;left:0;top:50%;height:49px;width:84px;border-radius:999px;pointer-events:none;will-change:transform,width,height;
    background:var(--lens-bg,rgba(0,0,0,.32));border:1px solid rgba(255,255,255,.1);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.14),inset 0 -8px 16px rgba(0,0,0,.12);transition:background .22s,border-color .22s,box-shadow .22s}
  #nav .glass-indicator::after{content:"";position:absolute;inset:0;border-radius:inherit;opacity:0;transition:opacity .22s ease;
    background:linear-gradient(180deg,rgba(255,255,255,.2),rgba(255,255,255,.06) 52%,rgba(255,255,255,.12))}
  /* once its own LiquidGL instance is live the lens refracts what is behind it; keep only a light tint */
  #nav .glass-indicator.liquid-glass-ready{position:absolute!important;opacity:1!important;pointer-events:none!important;transition:none!important;overflow:hidden;
    background:transparent!important}
  #nav.lifted .glass-indicator{border-color:rgba(255,255,255,.32);box-shadow:inset 0 1px 0 rgba(255,255,255,.46),inset 0 -1px 0 rgba(255,255,255,.08),0 3px 10px rgba(0,0,0,.1)}
  #nav.lifted .glass-indicator::after{opacity:1}
  /* LiquidGL sets inline opacity/transition/pointer-events on its target; these win over it */
  #nav.liquid-glass-ready,#nav.liquid-gl-loading{pointer-events:auto!important;transition:none!important}
  #nav.liquid-glass-ready{background:transparent!important;-webkit-backdrop-filter:none!important;backdrop-filter:none!important}
  #nav.liquid-gl-loading{opacity:1!important;background:var(--glass-tint)!important;-webkit-backdrop-filter:blur(14px) saturate(200%) brightness(1.04)!important;backdrop-filter:blur(14px) saturate(200%) brightness(1.04)!important}

  /* iOS scroll-edge effect: content softly blurs out under the bar and the status bar */
  body::after{content:"";position:fixed;left:0;right:0;bottom:0;height:calc(env(safe-area-inset-bottom) + var(--nav-h,76px) + 34px);pointer-events:none;z-index:3;-webkit-backdrop-filter:blur(calc(var(--glass-blur,20px) * .5));backdrop-filter:blur(calc(var(--glass-blur,20px) * .5));
    -webkit-mask:linear-gradient(to top,#000 25%,transparent);mask:linear-gradient(to top,#000 25%,transparent);background:linear-gradient(to top,color-mix(in srgb,var(--bg) 55%,transparent),transparent)}
  body::before{content:"";position:fixed;left:0;right:0;top:0;height:env(safe-area-inset-top);pointer-events:none;z-index:3;-webkit-backdrop-filter:blur(calc(var(--glass-blur,20px) * .6));backdrop-filter:blur(calc(var(--glass-blur,20px) * .6));-webkit-mask:linear-gradient(#000 40%,transparent);mask:linear-gradient(#000 40%,transparent)}

  const k = clamp(mn.p, -.035, 1.035), L = (a, b) => a + (b - a) * k;

  const shut = k === 0 && !expandedMenu;
  Object.assign(nav.style, shut ? {width: '', height: '', borderRadius: ''}
    : {width: L(mn.pill.w, mn.big.w) + 'px', height: L(mn.pill.h, mn.big.h) + 'px', borderRadius: L(39, 38) + 'px'});
  const st = clamp(Math.abs(mn.v) * .02, 0, .03), over = Math.max(0, mn.p - 1);
  mn.sx = 1 - st * .5 - over * .3; mn.sy = 1 + st + over * .6;

function mnTo(target, v = 0){
  cancelAnimationFrame(mn.raf); mn.target = target;
  if (reduced()) { mn.p = target; mn.v = 0; mnPaint(); mn.raf = 0; return mnSettled(); }
  v = clamp(v, -3, 3);
  let last = performance.now();
  const step = now => {
    const elapsed = Math.min(.032, (now - last) / 1000), n = Math.max(1, Math.ceil(elapsed * 120)); last = now;
    for (let i = 0; i < n; i++) { [mn.p, v] = spring(mn.p, v, target, 170, 22, elapsed / n); mn.p = clamp(mn.p, -.055, 1.055); }
    mn.v = v;
    if (Math.abs(mn.p - target) < .002 && Math.abs(v) < .03) { mn.p = target; mn.v = 0; mnPaint(); mn.raf = 0; return mnSettled(); }
    mnPaint(); mn.raf = requestAnimationFrame(step);
  };

}

function initNav(){

  const mid = b => bx(b) + b.offsetWidth / 2;
  const near = cx => navItems().reduce((a, b) => Math.abs(mid(b) - cx) < Math.abs(mid(a) - cx) ? b : a);
  const hot = b => navItems().forEach(x => x.classList.toggle('hot', x === b));
  const travel = () => Math.max(80, mn.big.h - mn.pill.h) * navK;
  function beginPull(){   // hand the nav to the JS-driven morph from wherever it is (closed, open or mid-flight)
    const closed = !expandedMenu && mn.p < .01;

    if (isDesk() || !e.isPrimary || pid !== null) return;
    if (mn.p > .01 && e.target.closest('input,select,textarea,label,#account-drawer button')) return;   // controls in the open sheet keep their own taps
    interrupted = !!mn.raf; if (interrupted) { cancelAnimationFrame(mn.raf); mn.raf = 0; }   // grab the sheet mid-flight

    if (!b) return;
    nav.classList.add('is-pressing');

    if (b.dataset.tab === tab) setLift(true);
  });

    if (e.pointerId !== pid) return;

}

/* name pill -> glass panel: width, height and radius are driven by the same spring as the menu bar, so it is interruptible and overshoots a hair */
const cp = {p: 0, v: 0, raf: 0, w0: 0, w1: 0, h0: 0, h1: 0};
function cpMeasure(){
  const el = $('#contact'); if (!el) return false;
  const head = $('.contact-head', el), body = $('.contact-body', el);
  cp.w0 = head.offsetWidth + 2; cp.h0 = head.offsetHeight + 2; cp.w1 = Math.min(340, innerWidth - 56);
  el.style.setProperty('--cw', (cp.w1 - 2) + 'px'); el.style.setProperty('--ch', head.offsetHeight + 'px');
  cp.h1 = head.offsetHeight + body.offsetHeight + 2;
  return true;
}
function cpPaint(){
  const el = $('#contact'); if (!el) return;
  const k = clamp(cp.p, -.06, 1.06), c = clamp(cp.p, 0, 1), L = (a, b) => a + (b - a) * k;
  Object.assign(el.style, {width: L(cp.w0, cp.w1) + 'px', height: L(cp.h0, cp.h1) + 'px', borderRadius: L(16, 28) + 'px'});
  const body = $('.contact-body', el);
  body.style.opacity = clamp(c * 1.8 - .6, 0, 1); body.style.filter = `blur(${Math.max(0, (1 - c) * 8).toFixed(2)}px)`;   // content fades in out of a blur

  el.classList.toggle('open', cp.p > .02);

function cpSettled(){
  const el = $('#contact'); if (!el) return;
  const open = cp.p >= 1, body = $('.contact-body', el);
  body.style.pointerEvents = open ? 'auto' : 'none'; body.inert = !open;
  $('.contact-head', el).setAttribute('aria-expanded', open);
}
function cpTo(target, v = 0){
  cancelAnimationFrame(cp.raf);
  if (reduced()) { cp.p = target; cp.v = 0; cpPaint(); cp.raf = 0; return cpSettled(); }
  v = clamp(v, -3, 3);
  let last = performance.now();
  const step = now => {
    const elapsed = Math.min(.032, (now - last) / 1000), n = Math.max(1, Math.ceil(elapsed * 120)); last = now;
    for (let i = 0; i < n; i++) { [cp.p, v] = spring(cp.p, v, target, 170, 22, elapsed / n); cp.p = clamp(cp.p, -.06, 1.06); }
    cp.v = v;
    if (Math.abs(cp.p - target) < .002 && Math.abs(v) < .03) { cp.p = target; cp.v = 0; cpPaint(); cp.raf = 0; return cpSettled(); }
    cpPaint(); cp.raf = requestAnimationFrame(step);
  };
  cp.raf = requestAnimationFrame(step);
}
function sizeContact(){   // after a render: snap to the current state with no animation
  cancelAnimationFrame(cp.raf); cp.raf = 0;
  if (!cpMeasure()) return;
  cp.p = contactOpen ? 1 : 0; cp.v = 0; cpPaint(); cpSettled();
}
function toggleContact(){
  if (!$('#contact')) return;
  contactOpen = !contactOpen;
  if (!cp.raf) cpMeasure();
  const body = $('#contact .contact-body'); body.inert = true; body.style.pointerEvents = 'none';
  cpTo(contactOpen ? 1 : 0, cp.v);   // keeps the current velocity when tapped mid-flight
}
document.addEventListener('pointerdown', e => { if (contactOpen && !e.target.closest('#contact')) toggleContact(); });
app.addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && e.target.matches?.('.contact-head')) { e.preventDefault(); toggleContact(); } });

/* iOS interactive glass: the highlight lands where the finger lands, the control springs down (CSS) */
addEventListener('pointerdown', e => {
  const el = e.target.closest('button:not(.ni):not(.tgl),.message-composer'); if (!el) return;
  const r = el.getBoundingClientRect();
  el.style.setProperty('--gx', e.clientX - r.left + 'px'); el.style.setProperty('--gy', e.clientY - r.top + 'px');
  el.classList.add('pressed');
  const off = () => { el.classList.remove('pressed'); removeEventListener('pointerup', off); removeEventListener('pointercancel', off); };
  addEventListener('pointerup', off); addEventListener('pointercancel', off);
});

function showErr(e){
  killViewGlass();
  app.innerHTML = `<div class="card gl"><b>Something went wrong</b><p>${esc(e && (e.message || e.reason || e))}</p><button id="retry">Back to sign in</button></div>`;
  requestAnimationFrame(initViewGlass);
  $('#retry').onclick = async () => { await sb.auth.signOut(); location.reload(); };
}
addEventListener('unhandledrejection', ev => showErr(ev.reason));
addEventListener('error', ev => showErr(ev.error || ev.message));
initNav(); applyTheme(); boot().catch(showErr);
</script></body></html>
