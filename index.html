    const r = nav.getBoundingClientRect();
    if (!moved && Math.abs(e.clientX - sx) > 8) { moved = true; lens.follow = true; lens.off = lens.x + G.w / 2 - (sx - r.left); nav.setPointerCapture?.(id); }
    if (moved) { lens.tx = Math.max(G.l[tabs[0]], Math.min(G.l[tabs[tabs.length - 1]], e.clientX - r.left + lens.off - G.w / 2)); kick(); }
  });
  const end = e => {
    if (id !== e.pointerId) return; id = null; lens.down = false; lens.follow = false;
    if (moved) { skip = true; setTimeout(() => skip = false); lens.trav = true; if (!go(nearest(lens.x + G.w / 2))) { lens.tx = G.l[tab]; kick(); } }
    else kick();
  };
  nav.addEventListener('pointerup', end); nav.addEventListener('pointercancel', end);
  nav.addEventListener('click', e => {
    const b = e.target.closest('.nv-track [data-tab]'); if (!b || skip) return;
    lens.trav = !wide(); go(b.dataset.tab);
  });
}

function render(){
  const act = document.activeElement?.id, keep = {};
  ['nt','ne','nx'].forEach(id => { const el = $('#' + id); if (el) keep[id] = el.value; });
  const p = partner(), mine = people[me], presets = mine.theme?.presets || defPresets;
  document.body.classList.toggle('min', collapsed);
  ensureNav(); syncNav();
  let body = '';
  if (tab === 'home') body = `
    <div class="card hero">${p ? `<div class="emoji">${esc(p.emoji)}</div><h2>${esc(p.name)}</h2>
      <div>${esc(p.status)}</div>
      <div class="muted"><span class="dot ${online(p) ? 'on' : ''}"></span>${online(p) ? 'Online now' : 'Last seen ' + new Date(p.last_seen).toLocaleString()}</div>`
      : `<p class="muted">Waiting for your partner to create their account.</p>`}</div>
    <div class="card"><b>Your status</b>
      <div class="chips" style="margin-top:8px">${presets.map(x => `<button class="${x === mine.emoji + ' ' + mine.status ? '' : 'ghost'}" data-preset="${esc(x)}">${esc(x)}</button>`).join('')}
        ${adding ? '' : '<button class="ghost" id="addbtn">+ Add status</button>'}</div>
      ${adding ? `<div class="row"><input id="ne" style="max-width:64px" placeholder="😀" aria-label="Emoji"><input id="nx" placeholder="Status name" aria-label="Status name"></div>
        <div class="row" style="margin-top:6px"><button id="addok">Add and use</button><button class="ghost" id="canc">Cancel</button></div>
        <div id="aerr" class="muted"></div>` : ''}</div>`;
  if (tab === 'notes') body = `<div class="card">${notes.length ? notes.map(n =>
      `<div class="note ${n.from_id === me ? 'me' : ''}">${esc(n.text)}</div>`).join('') : '<p class="muted">No notes yet. Send the first one.</p>'}
    <div class="row" style="margin-top:10px"><input id="nt" placeholder="Leave a note"><button id="send">Send note</button></div></div>`;
  if (tab === 'photos') body = `<div class="card"><div class="row" style="align-items:center"><button id="padd">+ Add photos</button>
    <input id="pf" type="file" accept="image/*" multiple hidden><span id="pmsg" class="muted"></span></div>
    ${photoErr ? `<p class="muted">Photos aren't set up yet. Run update2.sql in Supabase. (${esc(photoErr)})</p>` : ''}
    ${photos.length ? `<div class="grid">${photos.map(x => `<div data-ph="${x.id}"><img loading="lazy" src="${urlCache[x.path] || ''}" alt=""></div>`).join('')}</div>`
      : (photoErr ? '' : '<p class="muted">No photos yet. Add the first one.</p>')}</div>`;
  if (tab === 'settings') {
    const th = mine.theme || {}, g = th.global || {on: !!(th.bg && th.bg.toLowerCase() !== '#f2effa'), type: 'color'};
    body = `<div class="card"><h3 style="margin-top:0">You</h3>
    <label>Your name<input id="nm" value="${esc(mine.name)}"></label>
    <label>Accent color<input id="ac" type="color" value="${th.accent || '#e0457b'}"></label>
    <label>Font<select id="ft">${[['Rounded','ui-rounded, system-ui, sans-serif'],['Serif','Georgia, serif'],['Mono','ui-monospace, monospace'],['Handwritten','"Bradley Hand", "Comic Sans MS", cursive']]
      .map(([n, v]) => `<option value="${esc(v)}" ${th.font === v ? 'selected' : ''}>${n}</option>`).join('')}</select></label>
    <h3>Global settings</h3>
    <label class="chk"><input type="checkbox" id="gon" ${g.on ? 'checked' : ''}>Use my custom background</label>
    <label>Background type<select id="gt">${[['color','Color'],['image','Image'],['video','Looped video']]
      .map(([v, n]) => `<option value="${v}" ${g.type === v ? 'selected' : ''}>${n}</option>`).join('')}</select></label>
    <div id="gcolor" style="display:${g.type === 'color' ? 'block' : 'none'}"><label>Color<input id="bgc" type="color" value="${th.bg || '#f2effa'}"></label></div>
    <div id="gfile" style="display:${g.type === 'color' ? 'none' : 'block'}"><button class="ghost" id="gup" style="margin-top:8px">${g.path ? 'Replace file' : 'Upload file'}</button>
      <input id="gf" type="file" hidden accept="${g.type === 'video' ? 'video/*' : 'image/*'}"> <span id="gmsg" class="muted">${g.path ? 'File saved' : ''}</span></div>
    <div class="row" style="margin-top:16px;flex-wrap:wrap"><button id="sv">Save settings</button>
      <button class="ghost" id="nf">${notifOn() ? 'Disable notifications' : 'Enable notifications'}</button><button class="ghost" id="out">Sign out</button></div></div>`;
  }
  const vp = photos.find(x => x.id === viewing);
  app.innerHTML = body + (vp ? `<div id="lb"><img src="${urlCache[vp.path] || ''}" alt=""><div class="row"><button class="ghost" id="lbx">Close</button>${vp.owner === me ? '<button id="lbd">Delete</button>' : ''}</div></div>` : '');
  Object.entries(keep).forEach(([id, v]) => { const el = $('#' + id); if (el) el.value = v; });
  if (keep[act] !== undefined) $('#' + act)?.focus();
  const on = (id, fn) => $(id) && ($(id).onclick = fn);
  on('#tgl', () => { collapsed = !collapsed; ls.set('nav', collapsed ? 'min' : 'max'); render(); });
  app.querySelectorAll('[data-preset]').forEach(b => b.onclick = () => {
    const [e, ...rest] = b.dataset.preset.split(' ');
    save({emoji: e, status: rest.join(' ')}); });
  on('#addbtn', () => { adding = true; render(); $('#ne')?.focus(); });
  on('#canc', () => { adding = false; render(); });
  on('#addok', async () => {
    const g = seg($('#ne').value), em = g.length === 1 && isEmoji(g[0]) ? g[0] : '', tx = $('#nx').value.trim(), err = $('#aerr');
    if (!em) { err.textContent = 'Enter exactly one emoji.'; return; }
    if (!tx) { err.textContent = 'Enter a name for the status.'; return; }
    if (presets.some(x => emojiKey(x) === emojiKey(em))) { err.textContent = em + ' is already used. Pick a different emoji.'; return; }
    adding = false;
    await save({emoji: em, status: tx, theme: {...(mine.theme || {}), presets: [...presets, em + ' ' + tx]}});
  });
  on('#send', async () => {
    const t = $('#nt').value.trim(); if (!t) return;
    const { data, error } = await sb.from('notes').insert({text: t}).select().single();
    if (error) { toast('Could not send: ' + error.message); return; }
    $('#nt').value = '';
    if (!notes.some(x => x.id === data.id)) notes.push(data);
    render();
  });
  on('#padd', () => $('#pf').click());
  if ($('#pf')) $('#pf').onchange = async () => {
    const files = [...$('#pf').files];
    for (let i = 0; i < files.length; i++) {
      $('#pmsg') && ($('#pmsg').textContent = `Uploading ${i + 1} of ${files.length}...`);
      const path = await upload(files[i], 'photos'); if (!path) continue;
      const { data, error } = await sb.from('photos').insert({path}).select().single();
      if (error) { toast('Could not save photo: ' + error.message); continue; }
      await signed([path]); if (!photos.some(x => x.id === data.id)) photos.unshift(data);
    }
    render();
  };
  app.querySelectorAll('[data-ph]').forEach(el => el.onclick = () => { viewing = +el.dataset.ph; render(); });
  on('#lbx', () => { viewing = null; render(); });
  on('#lbd', async () => {
    const ph = photos.find(x => x.id === viewing); if (!ph || !confirm('Delete this photo?')) return;
    const { error } = await sb.from('photos').delete().eq('id', ph.id);
    if (error) { toast('Could not delete: ' + error.message); return; }
    await sb.storage.from('media').remove([ph.path]);
    photos = photos.filter(x => x.id !== ph.id); viewing = null; render();
  });
  on('#gup', () => $('#gf').click());
  if ($('#gt')) $('#gt').onchange = () => {
    const v = $('#gt').value;
    $('#gcolor').style.display = v === 'color' ? 'block' : 'none';
    $('#gfile').style.display = v === 'color' ? 'none' : 'block';
    $('#gf').accept = v === 'video' ? 'video/*' : 'image/*';
  };
  if ($('#gf')) $('#gf').onchange = async () => {
    const f = $('#gf').files[0]; if (!f) return;
    $('#gmsg').textContent = 'Uploading...';
    const path = await upload(f, 'bg'); if (!path) { $('#gmsg').textContent = 'Upload failed'; return; }
    const th = mine.theme || {};
    await save({theme: {...th, global: {...(th.global || {}), on: true, type: f.type.startsWith('video') ? 'video' : 'image', path}}});
  };
  on('#sv', async () => {
    const th = mine.theme || {}, g = th.global || {};
    if (await save({name: $('#nm').value, theme: {...th, accent: $('#ac').value, font: $('#ft').value, bg: $('#bgc').value,
      global: {...g, on: $('#gon').checked, type: $('#gt').value}}})) toast('Settings saved');
  });
  on('#nf', async () => {
    if (!('Notification' in window)) toast('Add the app to your Home Screen first, then try again.');
    else if (notifOn()) { ls.set('notif', 'off'); toast('Notifications off on this device'); }
    else if (Notification.permission === 'granted') { ls.set('notif', 'on'); toast('Notifications on'); }
    else if ((await Notification.requestPermission()) === 'granted') { ls.set('notif', 'on'); toast('Notifications on'); }
    else toast('Notifications blocked. Allow them in your device settings.');
    render();
  });
  on('#out', async () => { await sb.auth.signOut(); location.reload(); });
}
function showErr(e){
  app.innerHTML = `<div class="card"><b>Something went wrong</b><p>${esc(e && (e.message || e.reason || e))}</p><button id="retry">Back to sign in</button></div>`;
  $('#retry').onclick = async () => { await sb.auth.signOut(); location.reload(); };
}
addEventListener('unhandledrejection', ev => showErr(ev.reason));
addEventListener('error', ev => showErr(ev.error || ev.message));
applyTheme();
boot().catch(showErr);
</script></body></html>
