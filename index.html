@media(max-width:767px){
  #nav{
    left:50%; bottom:env(safe-area-inset-bottom); translate:-50% 0; scale:var(--nav-scale,1); transform-origin:50% 100%;
    padding:4px 8px 4px 8px; gap:0; border-radius:999px; width:auto;
    background:var(--glass-tint,rgba(255,255,255,.38));
    -webkit-backdrop-filter:blur(14px) saturate(200%) brightness(1.04); backdrop-filter:blur(14px) saturate(200%) brightness(1.04);
    box-shadow:0 12px 32px #0000002e,0 2px 8px #00000014,inset 0 1px 0 #ffffffb3,inset 0 -1px 0 #ffffff33,inset 0 0 22px #ffffff26;

  }
  #nav.is-pressing{scale:calc(var(--nav-scale,1) * 1.02)}
  #nav .ni span{display:none}
  #nav .ni{padding:8px 16px}

  /* Small subtle notch indicator directly inside the pill bar */
  #nav-handle{
    width:24px; height:3px; border-radius:999px; background:var(--ink); opacity:.25; margin-bottom:2px; cursor:pointer; flex-shrink:0; align-self:center;
  }

  /* specular rim, bright at opposite corners */
  #nav::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;pointer-events:none;z-index:3;
    background:linear-gradient(135deg,#fffffff2,#ffffff14 28%,#ffffff0a 62%,#ffffffd9);
    -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;
    mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);mask-composite:exclude}

  /* light pooling that follows the lens */
  #nav::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:0;
    background:radial-gradient(70px 48px at var(--lx,50%) 50%,#ffffff40,transparent 70%)}

  #nav.expanded .glass-indicator{display:none !important;}
  #nav .ni{position:relative;z-index:2;transition:color .2s,opacity .2s}
  #nav .ni svg,#nav .ni img{transition:transform .35s cubic-bezier(.3,1.5,.5,1)}
  #nav .ni.on{background:transparent}
  #nav .ni.on svg,#nav .ni.hot svg,#nav .ni.on img,#nav .ni.hot img{transform:scale(1.1)}
  #nav .ni.hot{color:var(--accent);opacity:1}
  #nav.is-dragging .ni.on:not(.hot){color:var(--ink);opacity:.65}

    border-radius:999px;pointer-events:none;will-change:transform;
    background:rgba(24,20,32,.28);
    border:0!important;outline:0!important;

    background:rgba(24,20,32,.34);

    -webkit-backdrop-filter:none!important;backdrop-filter:none!important}
  #nav.liquid-glass-ready .glass-indicator{background:transparent!important}

  /* pill <-> drawer morph */
  #nav{justify-content:flex-end}
  #nav.pulling{overflow:hidden}
  #nav-handle{opacity:calc(.25 * clamp(0, 1 - var(--p,0) * 4, 1))}
  #nav-row{display:flex;align-items:center;position:relative;z-index:2;
    opacity:clamp(0, calc(1 - var(--p,0) * 2.2), 1)}
  #nav .glass-indicator{opacity:clamp(0, calc(1 - var(--p,0) * 2.2), 1)}

  #account-drawer{position:absolute;top:12px;left:50%;translate:-50% 0;
    display:flex;flex-direction:column;gap:6px;box-sizing:border-box;pointer-events:none;
    opacity:clamp(0, calc(var(--p,0) * 1.8 - .6), 1)}
  #account-drawer input{-webkit-user-select:text;user-select:text}

  #nav.expanded{border-radius:24px;padding:12px 18px;width:min(calc(90vw * var(--nav-scale-inverse,1)),320px)}
  #nav.expanded #nav-row,#nav.expanded #nav-handle{display:none}
  #nav.expanded #account-drawer{position:static;translate:none;width:100%!important;
    pointer-events:auto;opacity:1}
}
@media(prefers-reduced-motion:reduce){
  #nav,#nav .ni,#nav .ni svg,#nav .ni img,#nav .glass-indicator{transition:none!important}
}
@media(min-width:768px){
  #nav{left:0;top:0;bottom:0;width:190px;flex-direction:column;gap:6px;padding:16px 12px;background:var(--card);border-right:1px solid #8882;transition:width .2s}
  #nav-handle{display:none}
  #nav-row{display:flex;flex-direction:column;gap:6px;width:100%}
  #account-drawer{display:none}
  .ni{flex-direction:row;gap:12px;font-size:15px;padding:12px 14px;border-radius:14px;width:100%}
  .tgl{display:block;align-self:flex-end;background:none;color:var(--ink);padding:4px 10px;margin-bottom:8px;opacity:.6}
  body{padding-left:206px}body.min{padding-left:88px}body.nonav{padding-left:16px}
  body.min #nav{width:72px}body.min .ni span{display:none}body.min .ni{justify-content:center}
  main{max-width:640px;padding-bottom:40px}.grid{grid-template-columns:repeat(4,1fr)}
}
</style></head>

<script>
const SUPABASE_URL = 'https://vffhgnflcrlddodldprn.supabase.co', SUPABASE_KEY = 'sb_publishable_ucjyfX7n8IKT5TtUyGZVUw_VKeqjj3L';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const $ = s => document.querySelector(s), app = $('#app');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ls = {get: k => { try { return localStorage.getItem(k); } catch { return null; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch {} }};
let me, people = {}, notes = [], photos = [], photoErr = '', tab = 'home', adding = false, viewing = null, collapsed = ls.get('nav') === 'min', expandedMenu = false;

function toast(msg, sys){
  const t = $('#toast'); t.textContent = msg; t.style.display = 'block';
  clearTimeout(t._t); t._t = setTimeout(() => t.style.display = 'none', 4000);
  if (sys && notifOn() && document.hidden)
    navigator.serviceWorker?.ready.then(r => r.showNotification(sys.title, {body: sys.body}));
}
async function signed(paths){
  const need = paths.filter(p => !urlCache[p]);
  if (need.length) {
    const { data } = await sb.storage.from('media').createSignedUrls(need, 86400);
    (data || []).forEach(d => { if (d.signedUrl) urlCache[d.path] = d.signedUrl; });
  }
  return urlCache;
}
async function upload(f, folder){
  const ext = (f.name.split('.').pop() || 'bin').toLowerCase().replace(/[^a-z0-9]/g, '');
  const path = `${me}/${folder}/${crypto.randomUUID()}.${ext}`;
  const { error } = await sb.storage.from('media').upload(path, f, {contentType: f.type});
  if (error) { toast('Upload failed: ' + error.message); return null; }
  return path;
}
async function setBg(g){
  const el = $('#bg'), key = g ? g.type + g.path : '';
  if (el.dataset.k === key) return;
  el.dataset.k = key; el.innerHTML = ''; document.body.classList.toggle('media', !!g);
  if (!g) return;
  const u = (await signed([g.path]))[g.path];
  if (!u) { el.dataset.k = ''; return; }
  el.innerHTML = g.type === 'video' ? `<video src="${u}" autoplay loop muted playsinline></video>` : `<img src="${u}" alt="">`;
}
async function applyTheme(){
  const th = people[me]?.theme || {}, r = document.documentElement.style;
  const g = th.global || {on: !!(th.bg && th.bg.toLowerCase() !== '#f2effa'), type: 'color'};
  const sysDark = matchMedia('(prefers-color-scheme: dark)').matches;
  const media = g.on && g.type !== 'color' && g.path;
  const bg = g.on && g.type === 'color' && th.bg ? th.bg : (sysDark ? '#17131f' : '#f2effa');
  const n = parseInt(bg.slice(1), 16), dark = (0.299 * (n >> 16) + 0.587 * ((n >> 8) & 255) + 0.114 * (n & 255)) / 255 < 0.5;
  r.setProperty('--accent', th.accent || '#e0457b');
  r.setProperty('--bg', bg);
  r.setProperty('--ink', dark ? '#f1eefb' : '#241f33');
  r.setProperty('--card', dark ? 'color-mix(in srgb, ' + bg + ' 85%, white)' : '#fff');
  r.setProperty('--glass-tint', dark ? 'rgba(255,255,255,.10)' : 'rgba(255,255,255,.38)');
  r.setProperty('--font', th.font || 'ui-rounded,system-ui,sans-serif');
  const navScale = Math.min(1.2, Math.max(.8, Number(th.navScale) || 1));
  r.setProperty('--nav-scale', navScale);
  r.setProperty('--nav-scale-inverse', 1 / navScale);
  setBg(media ? g : null);

  const paths = Object.values(people).map(p => p.avatar_url).filter(Boolean);
  if (paths.length) await signed(paths);
}
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyTheme);

async function boot(){
  const { data: { session } } = await sb.auth.getSession();
  if (!session) return login();
  me = session.user.id; document.body.classList.remove('nonav');
  let { data: ps, error: pe } = await sb.from('profiles').select('*');
  if (pe) throw pe;
  if (!ps.some(p => p.id === me)) {
    const { error: ie } = await sb.from('profiles').insert({id: me});
    if (ie) throw new Error('Your account has no profile row. Run fix.sql in Supabase. (' + ie.message + ')');
    ({ data: ps, error: pe } = await sb.from('profiles').select('*'));
    if (pe) throw pe;
  }
  ps.forEach(p => people[p.id] = p);
  const { data: ns, error: ne } = await sb.from('notes').select('*').order('created_at').limit(100);
  if (ne) throw ne;
  notes = ns;
  const { data: ph, error: phe } = await sb.from('photos').select('*').order('created_at', {ascending: false}).limit(200);
  photos = ph || []; photoErr = phe ? phe.message : '';
  if (photos.length) await signed(photos.map(x => x.path));
  sb.channel('us')
    .on('postgres_changes', {event:'*', schema:'public', table:'profiles'}, async payload => {
      const p = payload.new;
      const old = people[p.id]; people[p.id] = p;
      if (p.avatar_url) await signed([p.avatar_url]);
      if (p.id !== me && old && (old.status !== p.status || old.emoji !== p.emoji))
        toast(`${p.name} updated their Status to: ${p.emoji} ${p.status}`, {title: p.name, body: `updated their Status to: ${p.emoji} ${p.status}`});
      if (p.id === me) applyTheme();
      const same = old && old.status === p.status && old.emoji === p.emoji && old.name === p.name && old.avatar_url === p.avatar_url && old.border_color === p.border_color && JSON.stringify(old.theme) === JSON.stringify(p.theme);
      if (tab === 'settings' && (same || p.id !== me)) return;
      if (!(same && /INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName))) render();
    })
    .on('postgres_changes', {event:'INSERT', schema:'public', table:'notes'}, payload => {
      const n = payload.new;
      if (notes.some(x => x.id === n.id)) return;
      notes.push(n);
      if (n.from_id !== me) { const nm = people[n.from_id]?.name || 'Your partner'; toast(`${nm} sent you a Note!`, {title: nm, body: 'sent you a Note!'}); }
      if (tab === 'notes') render();

    if (e.eventType === 'DELETE') photos = photos.filter(x => x.id !== e.old.id);
    else if (e.eventType === 'INSERT' && !photos.some(x => x.id === e.new.id)) { await signed([e.new.path]); photos.unshift(e.new); }
    if (tab === 'photos') render();
  }).subscribe();
  heartbeat(); setInterval(heartbeat, 30000);
  document.addEventListener('visibilitychange', heartbeat);
  await applyTheme(); render();
}
async function heartbeat(){

        init(){

          document.querySelectorAll('canvas').forEach(canvas => {
            canvas.style.setProperty('pointer-events', 'none', 'important');
          });
        }

    });
    liquidGlass.registerDynamic(navItems());
  }).catch(error => {
    console.warn('LiquidGL could not load; using the CSS glass fallback.', error);
  }).finally(() => { liquidGlassPromise = null; });
  return liquidGlassPromise;
}

function selectTab(t){

function syncMessageComposerPosition(){

function syncTabs(){

/* ===== Pill <-> account drawer morph ===== */
const mn = {p: 0, raf: 0, pill: {w: 0, h: 0}, big: {w: 0, h: 0}};

function measurePill(){
  const n = $('#nav'), w = n.style.width, h = n.style.height, ex = n.classList.contains('expanded');
  n.classList.remove('expanded'); n.style.width = n.style.height = '';
  const r = {w: n.offsetWidth, h: n.offsetHeight};
  if (ex) n.classList.add('expanded');
  n.style.width = w; n.style.height = h;
  return r;
}
function mnLayout(){
  const d = $('#account-drawer'), inverseScale = parseFloat(getComputedStyle($('#nav')).getPropertyValue('--nav-scale-inverse')) || 1;
  const w = Math.min(innerWidth * .9 * inverseScale, 320);
  mn.pill = measurePill();
  d.style.width = (w - 36) + 'px';
  mn.big = {w, h: d.offsetHeight + 24};
}
function mnPaint(){
  const n = $('#nav'), k = Math.max(0, mn.p), L = (a, b) => a + (b - a) * k;
  n.style.setProperty('--p', Math.min(1, k));
  if (k === 0 && !expandedMenu) {
    n.classList.remove('pulling');
    n.style.width = n.style.height = n.style.borderRadius = '';
    $('#lens').style.left = ''; return;
  }
  const w = L(mn.pill.w, mn.big.w);
  n.classList.add('pulling');
  n.style.width = w + 'px';
  n.style.height = L(mn.pill.h, mn.big.h) + 'px';
  n.style.borderRadius = L(mn.pill.h / 2, 24) + 'px';
  $('#lens').style.left = (w - mn.pill.w) / 2 + 'px';   // keeps the lens over its icon while the nav widens
}
function mnTo(target, v = 0){
  cancelAnimationFrame(mn.raf);
  if (matchMedia('(prefers-reduced-motion:reduce)').matches) { mn.p = target; mnPaint(); mn.raf = 0; return mnSettled(); }
  let last = performance.now();
  const step = now => {
    const dt = Math.min(.032, (now - last) / 1000); last = now;
    v += (-300 * (mn.p - target) - 30 * v) * dt; mn.p += v * dt;
    if (Math.abs(mn.p - target) < .002 && Math.abs(v) < .03) { mn.p = target; mnPaint(); mn.raf = 0; return mnSettled(); }
    mnPaint(); mn.raf = requestAnimationFrame(step);
  };
  mn.raf = requestAnimationFrame(step);
}
function mnSettled(){
  const n = $('#nav'), d = $('#account-drawer');
  if (mn.p >= 1) {                       // hand over to the CSS .expanded layout (same size, so no jump)
    n.classList.add('expanded'); n.classList.remove('pulling');
    n.style.width = n.style.height = n.style.borderRadius = '';
    $('#lens').style.left = ''; d.inert = false;
  } else {
    n.classList.remove('expanded', 'pulling'); d.inert = true; mnPaint(); lgSync(true);
  }
}
function openMenu(v){ expandedMenu = true; syncTabs(); mnTo(1, v); }
function closeMenu(){
  if (!expandedMenu) return;
  const n = $('#nav'); cancelAnimationFrame(mn.raf);
  const big = {w: n.offsetWidth, h: n.offsetHeight};
  mn.pill = measurePill(); mn.big = big; mn.p = 1;
  $('#account-drawer').style.width = (big.w - 36) + 'px';
  expandedMenu = false; n.classList.remove('expanded'); syncTabs(); mnPaint();
  mnTo(0);
}
document.addEventListener('pointerdown', e => { if (expandedMenu && !e.target.closest('#nav')) closeMenu(); });

const bx = b => b.offsetLeft + $('#nav-row').offsetLeft;   // button x in #nav coordinates
function lgSync(snap){
  if (isDesk() || expandedMenu) return;
  const items = navItems(); if (!items.length) return;
  const b = items.find(x => x.dataset.tab === tab) || items[0];
  lg.tx = bx(b);
  lg.tw = b.offsetWidth;
  if (!lg.tw) return;
  if (snap || !lg.init || matchMedia('(prefers-reduced-motion:reduce)').matches) { lg.x = lg.tx; lg.w = lg.tw; lg.init = true; lgPaint(); }
  else lgStart();
}
function setLift(v){ lg.lift = v; $('#nav').classList.toggle('lifted', v); lgStart(); }
function lgPaint(){
  const el = $('#lens'); if (!el) return;
  const st = Math.min(.22, Math.abs(lg.vx) / 2600);
  el.style.width = lg.w + 'px';
  el.style.transform = `translate3d(${lg.x}px,0,0) scale(${lg.s * (1 + st)},${lg.s * (1 - st * .6)})`;
  $('#nav').style.setProperty('--lx', (lg.x + lg.w / 2) + 'px');
}
function lgStart(){ if (!lg.raf) { lg.last = performance.now(); lg.raf = requestAnimationFrame(lgFrame); } }
function lgFrame(now){
  const dt = Math.min(.032, (now - lg.last) / 1000); lg.last = now;
  const sp = (p, v, t, k, c) => { v += (-k * (p - t) - c * v) * dt; return [p + v * dt, v]; };
  const ts = lg.lift ? LIFT : 1;
  [lg.x, lg.vx] = sp(lg.x, lg.vx, lg.tx, lg.drag ? 520 : 300, lg.drag ? 34 : 21);
  [lg.w, lg.vw] = sp(lg.w, lg.vw, lg.tw, 300, 24);
  [lg.s, lg.vs] = sp(lg.s, lg.vs, ts, 320, 17);
  lgPaint();
  const rest = Math.abs(lg.x - lg.tx) < .1 && Math.abs(lg.vx) < .5 && Math.abs(lg.w - lg.tw) < .1 &&
               Math.abs(lg.vw) < .5 && Math.abs(lg.s - ts) < .002 && Math.abs(lg.vs) < .01;
  if (rest && !lg.drag) { lg.x = lg.tx; lg.w = lg.tw; lg.s = ts; lg.vx = lg.vw = lg.vs = 0; lgPaint(); lg.raf = 0; return; }
  lg.raf = requestAnimationFrame(lgFrame);
}

function initNav(){
  const nav = $('#nav');
  let pid = null, sx = 0, sy = 0, ly = 0, lt = 0, vy = 0, grab = 0, startBtn = null;
  let dragging = false, pulling = false, onHandle = false;
  const local = e => { const r = nav.getBoundingClientRect(); return (e.clientX - r.left) / (r.width / nav.offsetWidth); };
  const near = cx => navItems().reduce((a, b) => Math.abs(bx(b) + b.offsetWidth / 2 - cx) < Math.abs(bx(a) + a.offsetWidth / 2 - cx) ? b : a);
  const hot = b => navItems().forEach(x => x.classList.toggle('hot', x === b));
  const travel = () => Math.max(80, mn.big.h - mn.pill.h) * (parseFloat(getComputedStyle(nav).getPropertyValue('--nav-scale')) || 1);

  nav.addEventListener('pointerdown', e => {
    if (isDesk() || !e.isPrimary || pid !== null || expandedMenu || mn.raf) return;  // taps inside the open drawer are left alone
    const b = e.target.closest('[data-tab]');
    pid = e.pointerId; nav.setPointerCapture(pid);
    startBtn = b; onHandle = !!e.target.closest('#nav-handle');
    sx = local(e); sy = ly = e.clientY; lt = e.timeStamp; vy = 0; dragging = pulling = false;
    if (!b) return;
    nav.classList.add('is-pressing');
    const onLens = b.dataset.tab === tab;
    grab = onLens ? sx - lg.x : lg.w / 2;
    if (onLens) setLift(true);
  });

  nav.addEventListener('pointermove', e => {
    if (e.pointerId !== pid) return;
    const x = local(e), dy = sy - e.clientY, dt = e.timeStamp - lt;
    if (dt > 0) vy = .8 * vy + .2 * ((ly - e.clientY) / dt) * 1000;   // px/s, up is positive
    ly = e.clientY; lt = e.timeStamp;

    if (!pulling && !dragging && dy > 10) {
      pulling = true; startBtn = null;
      nav.classList.remove('is-pressing', 'is-dragging'); lg.drag = false; hot(null); setLift(false);
      fillDrawer(); mnLayout();
    }
    if (pulling) {
      let p = (dy - 10) / travel();
      if (p > 1) p = 1 + (p - 1) * .25;          // rubber-band past fully open
      mn.p = Math.max(0, p); mnPaint(); return;
    }

    if (!startBtn) return;
    if (!dragging && Math.abs(x - sx) > 6) { dragging = true; lg.drag = true; nav.classList.add('is-dragging'); setLift(true); }
    if (!dragging) return;
    const items = navItems(), min = bx(items[0]), max = bx(items.at(-1)) + items.at(-1).offsetWidth - lg.w;
    let left = x - grab;
    if (left < min) left = min - (min - left) * 0.25;
    if (left > max) left = max + (left - max) * 0.25;
    const h = near(left + lg.w / 2);
    lg.tx = left; lg.tw = h.offsetWidth; hot(h); lgStart();
  });

  const end = cancel => e => {
    if (e.pointerId !== pid) return;
    const wasPull = pulling, tapHandle = onHandle && !dragging && !wasPull && !cancel;
    const target = cancel || wasPull ? null : dragging ? near(lg.x + lg.w / 2) : startBtn;
    pid = null; dragging = pulling = false; lg.drag = false; startBtn = null;
    nav.classList.remove('is-pressing', 'is-dragging'); hot(null); setLift(false);

    if (wasPull) {
      const v = vy / travel();                    // progress units per second
      const open = !cancel && ((mn.p > .4 && vy > -600) || vy > 600);
      open ? openMenu(v) : mnTo(0, v);
      return;
    }
    if (tapHandle) { fillDrawer(); mnLayout(); openMenu(); return; }
    if (target) selectTab(target.dataset.tab); else lgSync();
  };
  nav.addEventListener('pointerup', end(false));
  nav.addEventListener('pointercancel', end(true));

  nav.addEventListener('click', e => {
    const b = e.target.closest('[data-tab]'); if (!b) return;
    if (!isDesk() && e.detail > 0) return;
    selectTab(b.dataset.tab);
  });
  new ResizeObserver(() => { lgSync(true); syncMessageComposerPosition(); }).observe(nav);
  addEventListener('resize', syncMessageComposerPosition);
  matchMedia('(max-width:767px)').addEventListener('change', initLiquidGlass);
  syncMessageComposerPosition();
}

    const files = [...$('#pf').files];
    for (let i = 0; i < files.length; i++) {
      $('#pmsg') && ($('#pmsg').textContent = `Uploading ${i + 1} of ${files.length}...`);
      const path = await upload(files[i], 'photos'); if (!path) continue;
      const { data, error } = await sb.from('photos').insert({path}).select().single();
      if (error) { toast('Could not save photo: ' + error.message); continue; }
      await signed([path]); if (!photos.some(x => x.id === data.id)) photos.unshift(data);
    }
    render();
  };
  app.querySelectorAll('[data-ph]').forEach(el => el.onclick = () => { viewing = +el.dataset.ph; render(); });
  on('#lbx', () => { viewing = null; render(); });
  on('#lbd', async () => {
    const ph = photos.find(x => x.id === viewing); if (!ph || !confirm('Delete this photo?')) return;
    const { error } = await sb.from('photos').delete().eq('id', ph.id);
    if (error) { toast('Could not delete: ' + error.message); return; }
    await sb.storage.from('media').remove([ph.path]);
    photos = photos.filter(x => x.id !== ph.id); viewing = null; render();
  });
  on('#gup', () => $('#gf').click());
  if ($('#gt')) $('#gt').onchange = () => {
    const v = $('#gt').value;
    $('#gcolor').style.display = v === 'color' ? 'block' : 'none';
    $('#gfile').style.display = v === 'color' ? 'none' : 'block';
    $('#gf').accept = v === 'video' ? 'video/*' : 'image/*';
  };
  if ($('#gf')) $('#gf').onchange = async () => {
    const f = $('#gf').files[0]; if (!f) return;
    $('#gmsg').textContent = 'Uploading...';
    const path = await upload(f, 'bg'); if (!path) { $('#gmsg').textContent = 'Upload failed'; return; }
    const th = mine.theme || {};
    await save({theme: {...th, global: {...(th.global || {}), on: true, type: f.type.startsWith('video') ? 'video' : 'image', path}}});
  };
  on('#sv', async () => {
    const th = mine.theme || {}, g = th.global || {};
    if (await save({theme: {...th, accent: $('#ac').value, font: $('#ft').value, bg: $('#bgc').value,
      navScale: Number($('#navScale').value) / 100,
      global: {...g, on: $('#gon').checked, type: $('#gt').value}}})) toast('Settings saved');
  });
  on('#nf', async () => {
    if (!('Notification' in window)) toast('Add the app to your Home Screen first, then try again.');
    else if (notifOn()) { ls.set('notif', 'off'); toast('Notifications off on this device'); }
    else if (Notification.permission === 'granted') { ls.set('notif', 'on'); toast('Notifications on'); }
    else if ((await Notification.requestPermission()) === 'granted') { ls.set('notif', 'on'); toast('Notifications on'); }
    else toast('Notifications blocked. Allow them in your device settings.');
    render();
  });
  on('#out', async () => { await sb.auth.signOut(); location.reload(); });
}
function showErr(e){
  app.innerHTML = `<div class="card"><b>Something went wrong</b><p>${esc(e && (e.message || e.reason || e))}</p><button id="retry">Back to sign in</button></div>`;
  $('#retry').onclick = async () => { await sb.auth.signOut(); location.reload(); };
}
addEventListener('unhandledrejection', ev => showErr(ev.reason));
addEventListener('error', ev => showErr(ev.error || ev.message));
initNav();
applyTheme();
boot().catch(showErr);
</script></body></html>
